<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">批次：B 条序列摞成 [B, T]</title>
<desc id="desc">两条序列共用同一个模型和权重，分别得到 [B, T, C] 的嵌入。</desc>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="30" y="38" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">批次：B 条序列并排，共用同一套权重</text>
<text x="30" y="64" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">输入 [B, T]，模型内部 [B, T, C]；序列之间独立。</text>
<rect x="60" y="120" width="210" height="48" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="165" y="149" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1f2937">the cat sat</text>
<text x="45" y="149" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">B=0</text>
<rect x="60" y="204" width="210" height="48" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="165" y="233" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1f2937">the dog sat</text>
<text x="45" y="233" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">B=1</text>
<text x="60" y="300" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b6ea5">同一套 TinyGPT 权重</text>
<line x1="270" y1="144" x2="380" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="270" y1="228" x2="380" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="385" y="160" width="220" height="80" rx="10" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="495" y="194" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#1e3a5f">TinyGPT</text>
<text x="495" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">同一个 model</text>
<line x1="605" y1="200" x2="700" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="705" y="100" width="250" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="830" y="132" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1f2937">输出 [B, T, C]</text>
<rect x="735" y="160" width="190" height="44" rx="6" fill="#ecfdf5" stroke="#047857"/>
<text x="830" y="187" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#047857">B=0: [T, 16]</text>
<rect x="735" y="220" width="190" height="44" rx="6" fill="#ecfdf5" stroke="#047857"/>
<text x="830" y="247" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#047857">B=1: [T, 16]</text>
<text x="60" y="360" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#475569">第 0 条序列和第 1 条序列互不影响；同一个 token 在不同序列里各自查表。</text>
<text x="60" y="392" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">训练时对 B 条序列的梯度求平均；推理时 B 条请求并排计算。</text>
<text x="60" y="452" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">批次大小是 B；序列长度不同时，先用填充符（padding）补齐到同一个长度 T。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs></svg>
