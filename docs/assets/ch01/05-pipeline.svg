<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc">
<title id="title">从字符到答案：第 3 节的管线</title>
<desc id="desc">13 个位置经过嵌入表得到 16 维向量，图中省略中间 8 个；向量相加得到横向输出向量，再经输出矩阵得到 68 个分数，编号 21 最高，由占位函数解码成 v。</desc>
