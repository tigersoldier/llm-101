<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">Pre-LN Transformer block：两条残差路径</title>
<desc id="desc">x 经 LayerNorm 和注意力后加回 x；再经 LayerNorm 和 MLP 后加回 x1；两个子层都保持 [B, T, C]。</desc>
<rect width="900" height="760" fill="#ffffff"/>
<text x="30" y="38" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#1f2937">Pre-LN Transformer block：两条残差路径</text>
<text x="30" y="62" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="11.5" fill="#64748b">每个子层都先 LayerNorm，再把子层输出加回输入；主路保持干净。</text>

<rect x="320" y="90" width="260" height="40" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="450" y="115" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#1f2937">x  [B, T, C]</text>
<line x1="450" y1="130" x2="450" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="320" y="162" width="260" height="40" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
<text x="450" y="187" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#5b21b6">LayerNorm 1</text>
<line x1="450" y1="202" x2="450" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="320" y="234" width="260" height="40" rx="8" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="450" y="259" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#1e3a5f">多头自注意力</text>
<line x1="450" y1="274" x2="450" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="320" y="306" width="260" height="40" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="450" y="331" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#1f2937">+  残差 1</text>
<line x1="450" y1="346" x2="450" y2="374" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="320" y="378" width="260" height="40" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="450" y="403" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12.5" fill="#1f2937">x1 = x + attn(LayerNorm(x))</text>
<line x1="450" y1="418" x2="450" y2="446" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="320" y="450" width="260" height="40" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
<text x="450" y="475" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#5b21b6">LayerNorm 2</text>
<line x1="450" y1="490" x2="450" y2="518" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="320" y="522" width="260" height="40" rx="8" fill="#fff7ed" stroke="#c2410c"/>
<text x="450" y="547" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" fill="#7c2d12">MLP：Linear → GELU → Linear</text>
<line x1="450" y1="562" x2="450" y2="590" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="320" y="594" width="260" height="40" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="450" y="619" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#1f2937">+  残差 2</text>
<line x1="450" y1="634" x2="450" y2="662" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="320" y="666" width="260" height="40" rx="8" fill="#ecfdf5" stroke="#047857"/>
<text x="450" y="691" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12.5" fill="#065f46">x2 = x1 + mlp(LayerNorm(x1))</text>

<path d="M 580 110 L 760 110 L 760 326 L 582 326" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="210" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#047857">残差 1</text>
<path d="M 580 398 L 760 398 L 760 614 L 582 614" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="498" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#047857">残差 2</text>

<text x="30" y="730" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#64748b">两条残差都保留输入；Pre-LN 把 LayerNorm 放在子层之前，残差主路不经过 LayerNorm。</text>
<text x="30" y="748" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#64748b">注意力混合位置，MLP 逐位置变换；两者输出都与输入同形 [B, T, C]。</text>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
