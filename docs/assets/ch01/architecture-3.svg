<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" role="img" aria-labelledby="title desc">
<title id="title">第 3 节结束时的管线架构</title>
<desc id="desc">实线表示本节已经实现的组件，虚线表示仍在使用的占位组件。</desc>
<rect width="760" height="880" fill="#ffffff"/>
<text x="30" y="36" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="600" fill="#1f2937">第 3 节结束时的管线</text>
<text x="730" y="36" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">实线 = 已实现，虚线 = 占位</text>
<rect x="110" y="80" width="540" height="64" rx="10" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="135" y="106" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#1f2937">文字</text>
<text x="135" y="130" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">the cat sat</text>
<text x="625" y="119" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#047857">真</text>
<line x1="380" y1="148" x2="380" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="172" width="540" height="64" rx="10" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="135" y="198" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#1f2937">编号</text>
<text x="135" y="222" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">CharacterTokenizer（分词器）</text>
<text x="625" y="211" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#047857">真</text>
<line x1="380" y1="240" x2="380" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="264" width="540" height="64" rx="10" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="135" y="290" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#1f2937">向量</text>
<text x="135" y="314" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">Embedding（嵌入表）</text>
<text x="625" y="303" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#047857">真</text>
<line x1="380" y1="332" x2="380" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="356" width="540" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="135" y="382" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#1f2937">位置</text>
<text x="135" y="406" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">占位：不加</text>
<text x="625" y="395" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">占位</text>
<line x1="380" y1="424" x2="380" y2="444" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="448" width="540" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="135" y="474" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#1f2937">混合</text>
<text x="135" y="498" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">占位：累加取余</text>
<text x="625" y="487" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">占位</text>
<line x1="380" y1="516" x2="380" y2="536" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="540" width="540" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="135" y="566" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#1f2937">归一化/筛选</text>
<text x="135" y="590" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">占位：恒等</text>
<text x="625" y="579" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">占位</text>
<line x1="380" y1="608" x2="380" y2="628" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="632" width="540" height="64" rx="10" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="135" y="658" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#1f2937">分数</text>
<text x="135" y="682" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">Linear 输出</text>
<text x="625" y="671" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#047857">真</text>
<line x1="380" y1="700" x2="380" y2="720" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="724" width="540" height="64" rx="10" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="135" y="750" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#1f2937">下一个字符</text>
<text x="135" y="774" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">argmax</text>
<text x="625" y="763" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#047857">真</text>
<text x="30" y="840" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">占位组件只为了让管线先跑起来；后面的小节逐个替换它们。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
