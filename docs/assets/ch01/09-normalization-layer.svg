<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-labelledby="title desc">
<title id="title">LayerNorm：沿每一行（T 轴）</title>
<desc id="desc">每行是一个位置；在这行的 C 个特征上求均值/方差。</desc>
<rect width="560" height="470" fill="#ffffff"/>
<text x="24" y="34" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#1f2937">LayerNorm：沿每一行（T 轴）</text>
<text x="24" y="58" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">每行是一个位置；在这行的 C 个特征上求均值/方差。</text>
<rect x="120" y="110" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="156" y="110" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="192" y="110" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="228" y="110" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="264" y="110" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="120" y="146" width="36" height="36" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<rect x="156" y="146" width="36" height="36" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<rect x="192" y="146" width="36" height="36" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<rect x="228" y="146" width="36" height="36" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<rect x="264" y="146" width="36" height="36" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<rect x="120" y="182" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="156" y="182" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="192" y="182" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="228" y="182" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="264" y="182" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="120" y="218" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="156" y="218" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="192" y="218" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="228" y="218" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="264" y="218" width="36" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="110" y="132.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">0</text>
<text x="110" y="168.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">1</text>
<text x="110" y="204.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">2</text>
<text x="110" y="240.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">3</text>
<text x="138.0" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">0</text>
<text x="174.0" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">1</text>
<text x="210.0" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">2</text>
<text x="246.0" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">3</text>
<text x="282.0" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">4</text>
<line x1="90" y1="254" x2="90" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="76" y="182.0" text-anchor="middle" transform="rotate(-90 76 182.0)" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#475569">T（位置）</text>
<line x1="120" y1="288" x2="338" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210.0" y="312" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#475569">C（特征）</text>
<line x1="308" y1="164.0" x2="352" y2="164.0" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
<text x="308" y="182.0" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#6d28d9">沿这一行</text>
<text x="24" y="440" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">T/B 是竖直轴，C 是水平轴；高亮的部分是求均值/方差的方向。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
</svg>
