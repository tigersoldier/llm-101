<text x="24" y="34" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#1f2937">LayerNorm：沿每一行（T 轴）</text>
<text x="24" y="58" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">每行是一个位置；在这行的 C 个特征上求均值/方差。</text>
