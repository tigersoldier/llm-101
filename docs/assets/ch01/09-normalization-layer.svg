<line x1="120" y1="300" x2="338" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210" y="324" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#475569">特征（C 列）</text>
<path d="M 306 110 L 312 110 L 312 146 L 306 146" fill="none" stroke="#6d28d9" stroke-width="2"/>
<text x="322" y="132" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#6d28d9">沿这一行求 μ、σ²</text>
<text x="24" y="356" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">T 是竖直轴，C 是水平轴；高亮的部分是求均值/方差的方向。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
</svg>
