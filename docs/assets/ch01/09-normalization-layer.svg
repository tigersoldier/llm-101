<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="title desc">
<title id="title">LayerNorm：沿每一行（T 轴）</title>
<desc id="desc">每行是一个位置；在这行的 C 个特征上求均值/方差。样例是 4 行 5 列、按 1 到 20 顺序填入的张量。</desc>
