<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">1.3 的 W_out 与 1.6 的 Linear</title>
<desc id="desc">左边是固定的 16×68 输出矩阵，无偏置；右边是可训练的 Linear，带偏置。</desc>
<rect width="1040" height="620" fill="#ffffff"/>
<text x="30" y="38" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">1.3 的 W_out 与 1.6 的 Linear：同一件事的两个版本</text>
<text x="30" y="64" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">左边固定、无偏置；右边可训练、带偏置。形状按本章的实际配置标注。</text>
<rect x="30" y="90" width="470" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="120" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="600" fill="#1f2937">1.3 的 W_out：固定打分</text>
<rect x="60" y="170" width="140" height="60" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="135.0" y="204.33333333333334" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a5f">o [16]</text>
<rect x="240" y="150" width="160" height="100" rx="8" fill="#fff7ed" stroke="#c2410c"/><text x="360.0" y="204.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#7c2d12">W_out [16, 68] 无偏置，固定</text>
<rect x="420" y="170" width="80" height="60" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="460.0" y="204.33333333333334" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#064e3b">scores [68]</text>
<line x1="200" y1="200" x2="238" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="400" y1="200" x2="418" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="60" y="300" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">scores = o @ W_out</text>
<text x="60" y="330" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">1.3 用它把 16 维输出向量变成 68 个分数；矩阵是随机初始化后固定的。</text>
<text x="60" y="360" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">没有偏置；训练时不会调整。</text>
<rect x="530" y="90" width="480" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="550" y="120" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="600" fill="#1f2937">1.6 的 Linear：可训练矩阵乘法</text>
<rect x="550" y="170" width="130" height="60" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="615.0" y="204.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1e3a5f">X [..., 16]</text>
<rect x="710" y="150" width="130" height="100" rx="8" fill="#ede9fe" stroke="#6d28d9"/><text x="775.0" y="204.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#4c1d95">W [16, 16] 可训练</text>
<rect x="710" y="270" width="130" height="50" rx="8" fill="#fff7ed" stroke="#c2410c"/><text x="775.0" y="299.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#7c2d12">b [16]</text>
<rect x="870" y="170" width="120" height="60" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="930.0" y="204.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#064e3b">Y [..., 16]</text>
<line x1="680" y1="200" x2="708" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="840" y1="200" x2="868" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="775" y1="250" x2="775" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="340" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">Y = XW + b</text>
<text x="550" y="370" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">Q/K/V 三个投影各用一个 Linear(16, 16)；W、b 都参与训练。</text>
<text x="550" y="400" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">Linear 也能做 16→68：把 out_features 换成 68 即可。</text>
<text x="30" y="560" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">小例子：o=[1,2,3]，W=[[1,0],[0,1],[1,1]]；W_out 给 [4,5]，Linear 加 b=[0.5,-0.5] 给 [4.5,4.5]。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
