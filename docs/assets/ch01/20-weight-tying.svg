<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830" role="img" aria-labelledby="title desc">
<title id="title">权重绑定：输入查表与输出打分共用同一张 E [68,16]</title>
<desc id="desc">the cat sat 的第一个 token id 66（字符 t）查 E 的第 66 行得到 16 维向量；最后一个位置的隐藏状态 Z [16] 与 E 的每一行做点积，即乘 Eᵀ，得到 logits [68]。两条路径共用同一张 E；不绑定会多出 1,088 个参数，总参数从 6,912 降到 5,824。</desc>
<rect width="1080" height="830" fill="#ffffff"/>
<text x="40" y="40" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">权重绑定：输入查表与输出打分共用同一张 E [68,16]</text>
<text x="40" y="66" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" fill="#64748b">例：the cat sat；第一个 token id 是 66（字符 't'），最后一个位置的隐藏状态是 Z [16]。</text>
<text x="40" y="88" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" fill="#475569">E 只存一份：输入查表读第 66 行，输出打分用它的转置（Eᵀ）。</text>
<text x="40" y="106" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="11" fill="#64748b">数值来自 seed=3 的随机权重，只用于核对形状和共享关系；答案没有语义。</text>
<text x="560" y="170" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#1f2937">E [68,16]（token 嵌入表）</text>
<text x="560" y="192" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">列：特征（C = 16）→</text>
<text x="720" y="192" text-anchor="start" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">行：词表（vocab = 68）↓</text>
