<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-labelledby="title desc">
<title id="title">词级切分：3 个词，catz 变成 &lt;unk&gt;</title>
<desc id="desc">the catz sat 按空格切成 the、catz、sat 三个 token；catz 不在约 50,000 个词的词表里，被换成 &lt;unk&gt;，原来的拼写丢失。</desc>
<rect width="560" height="470" fill="#ffffff"/>
<text x="24" y="34" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#1f2937">词级切分</text>
<text x="24" y="58" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">按空格把句子切成词；词表里的词直接查编号。</text>
<rect x="140" y="84" width="280" height="40" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="280" y="109" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12.5" fill="#1f2937">输入：the catz sat（12 个字符）</text>
<line x1="280" y1="124" x2="280" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="298" y="146" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10.5" fill="#64748b">按空格切分</text>
<rect x="92" y="170" width="96" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="140" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#1f2937">the</text>
<text x="140" y="222" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">词表内</text>
<rect x="212" y="170" width="136" height="72" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="280" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#9a3412">catz</text>
<text x="280" y="220" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#c2410c">词表外：&lt;unk&gt;</text>
<text x="280" y="235" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="9.5" fill="#c2410c">拼写丢失</text>
<rect x="372" y="170" width="96" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="420" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#1f2937">sat</text>
<text x="420" y="222" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">词表内</text>
<rect x="92" y="258" width="376" height="48" rx="8" fill="#fff7ed" stroke="#c2410c"/>
<text x="280" y="276" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10.5" fill="#9a3412">catz 不在词表里：整词换成 &lt;unk&gt;，原来的拼写无法恢复。</text>
<text x="280" y="292" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="9.5" fill="#c2410c">OOV = out-of-vocabulary（未登录词）</text>
<rect x="92" y="322" width="176" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="180" y="342" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10.5" fill="#64748b">token 数</text>
<text x="180" y="369" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="600" fill="#1f2937">3</text>
<rect x="292" y="322" width="176" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="342" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10.5" fill="#64748b">词表大小</text>
<text x="380" y="369" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#1f2937">约 50,000</text>
<line x1="92" y1="420" x2="122" y2="420" stroke="#475569" stroke-width="2"/>
<text x="128" y="424" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#475569">灰色实线：词表内的词</text>
<line x1="258" y1="420" x2="288" y2="420" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="294" y="424" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#c2410c">橙色虚线：词表外的词（&lt;unk&gt;）</text>
<text x="24" y="448" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">同一句 12 个字符，词级只需要 3 个 token，但 catz 的拼写丢了。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
