<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="title desc">
  <title id="title">一次矩阵乘法</title>
  <desc id="desc">x [2,3] 乘 W [3,2] 再加偏置，得到 y [2,2]；y[0,1] 是 x 第一行与 W 第二列的点积。</desc>
  <rect width="860" height="340" fill="#ffffff"/>
  <text x="30" y="34" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="600" fill="#1f2937">一次矩阵乘法：y = x W + b</text>

  <text x="40" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">x  [T, in] = [2, 3]</text>
  <g stroke="#94a3b8" stroke-width="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="40" y="84" width="54" height="46" fill="#dbeafe"/>
    <rect x="94" y="84" width="54" height="46" fill="#dbeafe"/>
    <rect x="148" y="84" width="54" height="46" fill="#dbeafe"/>
    <rect x="40" y="130" width="54" height="46" fill="#ffffff"/>
    <rect x="94" y="130" width="54" height="46" fill="#ffffff"/>
    <rect x="148" y="130" width="54" height="46" fill="#ffffff"/>
    <text x="67" y="113">1</text>
    <text x="121" y="113">2</text>
    <text x="175" y="113">3</text>
    <text x="67" y="159">7</text>
    <text x="121" y="159">8</text>
    <text x="175" y="159">9</text>
  </g>

  <text x="215" y="120" font-family="system-ui, sans-serif" font-size="22" fill="#334155">×</text>

  <text x="260" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">W  [in, out] = [3, 2]</text>
  <g stroke="#94a3b8" stroke-width="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="260" y="84" width="64" height="46" fill="#ffffff"/>
    <rect x="324" y="84" width="64" height="46" fill="#fed7aa"/>
    <rect x="260" y="130" width="64" height="46" fill="#ffffff"/>
    <rect x="324" y="130" width="64" height="46" fill="#fed7aa"/>
    <rect x="260" y="176" width="64" height="46" fill="#ffffff"/>
    <rect x="324" y="176" width="64" height="46" fill="#fed7aa"/>
    <text x="292" y="113">1</text>
    <text x="356" y="113">0</text>
    <text x="292" y="159">0</text>
    <text x="356" y="159">1</text>
    <text x="292" y="205">1</text>
    <text x="356" y="205">1</text>
  </g>

  <text x="425" y="120" font-family="system-ui, sans-serif" font-size="22" fill="#334155">=</text>

  <text x="465" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">y  [T, out] = [2, 2]</text>
  <g stroke="#94a3b8" stroke-width="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="465" y="84" width="64" height="46" fill="#ffffff"/>
    <rect x="529" y="84" width="64" height="46" fill="#bbf7d0"/>
    <rect x="465" y="130" width="64" height="46" fill="#ffffff"/>
    <rect x="529" y="130" width="64" height="46" fill="#ffffff"/>
    <text x="497" y="113">4.5</text>
    <text x="561" y="113">4.5</text>
    <text x="497" y="159">16.5</text>
    <text x="561" y="159">16.5</text>
  </g>

  <text x="40" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#334155">y[t, o] = Σi x[t, i] × W[i, o] + b[o]</text>
  <text x="40" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">y[0, 1] = 1×0 + 2×1 + 3×1 + (−0.5) = 4.5</text>
  <text x="40" y="326" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">绿色：第一个输出位置；橙色：W 的第二列。</text>
</svg>
