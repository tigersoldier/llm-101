<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">自注意力管线：3 个位置、2 个头的手算例子</title>
<desc id="desc">以头 0 为例：X 投影成 Q/K/V；q/k 成对排在同一行；QK^T/sqrt(D) 打分，掩码去掉未来，softmax 成权重，权重乘 V；头 1 同理，最后拼头再过 out_proj。</desc>
<rect width="1200" height="1080" fill="#ffffff"/>
<text x="30" y="38" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">自注意力管线：3 个位置、2 个头的手算例子</text>
<text x="30" y="64" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" fill="#64748b">C=4，H=2，D=2，T=3；Q=K=V=X。这里画头 0，q/k 成对排在同一行；头 1 同理，最后拼头再过 out_proj。</text>

<text x="30" y="114" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">输入 X [3, 4]</text>
<rect x="180" y="90" width="140" height="50" rx="7" fill="#eef2f7" stroke="#94a3b8"/>
<text x="250" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#1f2937">x0 = [1,0,0,0]</text>
<text x="250" y="128" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">位置 0</text>
<rect x="370" y="90" width="140" height="50" rx="7" fill="#eef2f7" stroke="#94a3b8"/>
<text x="440" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#1f2937">x1 = [0,1,0,0]</text>
<text x="440" y="128" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">位置 1</text>
<rect x="560" y="90" width="140" height="50" rx="7" fill="#eef2f7" stroke="#94a3b8"/>
<text x="630" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#1f2937">x2 = [0,0,1,0]</text>
<text x="630" y="128" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">位置 2</text>

<line x1="440" y1="140" x2="440" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460" y="158" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#64748b">投影 + 拆头（头 0）</text>

<text x="30" y="190" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">头 0 的 Q/K [3, 2]：q/k 成对</text>
<rect x="100" y="180" width="120" height="54" rx="7" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="160" y="201" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1e3a5f">q0 = [1,0]</text>
<text x="160" y="218" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">query 0</text>
<rect x="250" y="180" width="120" height="54" rx="7" fill="#fff7ed" stroke="#c2410c"/>
<text x="310" y="201" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#7c2d12">k0 = [1,0]</text>
<text x="310" y="218" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">key 0</text>
<rect x="400" y="180" width="120" height="54" rx="7" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="460" y="201" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1e3a5f">q1 = [0,1]</text>
<text x="460" y="218" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">query 1</text>
<rect x="550" y="180" width="120" height="54" rx="7" fill="#fff7ed" stroke="#c2410c"/>
<text x="610" y="201" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#7c2d12">k1 = [0,1]</text>
<text x="610" y="218" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">key 1</text>
<rect x="700" y="180" width="120" height="54" rx="7" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="760" y="201" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1e3a5f">q2 = [0,0]</text>
<text x="760" y="218" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">query 2</text>
<rect x="850" y="180" width="120" height="54" rx="7" fill="#fff7ed" stroke="#c2410c"/>
<text x="910" y="201" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#7c2d12">k2 = [0,0]</text>
<text x="910" y="218" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="9" fill="#64748b">key 2</text>

<text x="30" y="280" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">头 0 的 V [3, 2]</text>
<rect x="100" y="270" width="120" height="50" rx="7" fill="#ecfdf5" stroke="#047857"/>
<text x="160" y="300" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#065f46">v0 = [1,0]</text>
<rect x="400" y="270" width="120" height="50" rx="7" fill="#ecfdf5" stroke="#047857"/>
<text x="460" y="300" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#065f46">v1 = [0,1]</text>
<rect x="700" y="270" width="120" height="50" rx="7" fill="#ecfdf5" stroke="#047857"/>
<text x="760" y="300" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#065f46">v2 = [0,0]</text>

<line x1="250" y1="234" x2="250" y2="354" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="30" y="374" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">S0 = QKᵀ / √D [3, 3]</text>
<g font-family="ui-monospace, monospace" font-size="11" fill="#1f2937">
<rect x="180" y="360" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="220" y="390" text-anchor="middle">0.707</text>
<rect x="260" y="360" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="300" y="390" text-anchor="middle">0</text>
<rect x="340" y="360" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="380" y="390" text-anchor="middle">0</text>
<rect x="180" y="410" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="220" y="440" text-anchor="middle">0</text>
<rect x="260" y="410" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="300" y="440" text-anchor="middle">0.707</text>
<rect x="340" y="410" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="380" y="440" text-anchor="middle">0</text>
<rect x="180" y="460" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="220" y="490" text-anchor="middle">0</text>
<rect x="260" y="460" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="300" y="490" text-anchor="middle">0</text>
<rect x="340" y="460" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="380" y="490" text-anchor="middle">0</text>
</g>

<line x1="420" y1="435" x2="474" y2="435" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="374" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">掩码：j &gt; i → -∞</text>
<g font-family="ui-monospace, monospace" font-size="11" fill="#1f2937">
<rect x="500" y="360" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="540" y="390" text-anchor="middle">0.707</text>
<rect x="580" y="360" width="80" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="620" y="390" text-anchor="middle">-∞</text>
<rect x="660" y="360" width="80" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="700" y="390" text-anchor="middle">-∞</text>
<rect x="500" y="410" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="540" y="440" text-anchor="middle">0</text>
<rect x="580" y="410" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="620" y="440" text-anchor="middle">0.707</text>
<rect x="660" y="410" width="80" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="700" y="440" text-anchor="middle">-∞</text>
<rect x="500" y="460" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="540" y="490" text-anchor="middle">0</text>
<rect x="580" y="460" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="620" y="490" text-anchor="middle">0</text>
<rect x="660" y="460" width="80" height="50" fill="#f8fafc" stroke="#94a3b8"/><text x="700" y="490" text-anchor="middle">0</text>
</g>

<line x1="740" y1="435" x2="794" y2="435" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="820" y="374" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">softmax → A0 [3, 3]</text>
<g font-family="ui-monospace, monospace" font-size="11" fill="#1f2937">
<rect x="820" y="360" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="860" y="390" text-anchor="middle">1</text>
<rect x="900" y="360" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="940" y="390" text-anchor="middle">0</text>
<rect x="980" y="360" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="1020" y="390" text-anchor="middle">0</text>
<rect x="820" y="410" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="860" y="440" text-anchor="middle">0.5</text>
<rect x="900" y="410" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="940" y="440" text-anchor="middle">0.5</text>
<rect x="980" y="410" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="1020" y="440" text-anchor="middle">0</text>
<rect x="820" y="460" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="860" y="490" text-anchor="middle">1/3</text>
<rect x="900" y="460" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="940" y="490" text-anchor="middle">1/3</text>
<rect x="980" y="460" width="80" height="50" fill="#ede9fe" stroke="#6d28d9"/><text x="1020" y="490" text-anchor="middle">1/3</text>
</g>

<line x1="940" y1="510" x2="940" y2="560" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="700" y="590" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">A0V0 [3, 2]（头 0 输出）</text>
<g font-family="ui-monospace, monospace" font-size="11" fill="#1f2937">
<rect x="760" y="600" width="120" height="44" fill="#ecfdf5" stroke="#047857"/><text x="820" y="626" text-anchor="middle">[1, 0]</text>
<rect x="760" y="644" width="120" height="44" fill="#ecfdf5" stroke="#047857"/><text x="820" y="670" text-anchor="middle">[0.5, 0.5]</text>
<rect x="760" y="688" width="120" height="44" fill="#ecfdf5" stroke="#047857"/><text x="820" y="714" text-anchor="middle">[1/3, 1/3]</text>
</g>
<text x="850" y="290" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#047857">V [3, 2]</text>
<path d="M 920 295 L 1100 295 L 1100 622 L 884 622" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1110" y="470" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#047857">V</text>

<line x1="820" y1="732" x2="820" y2="838" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="890" y="790" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">头 1 同理（q/k/v 在另一半 2 维）</text>
<text x="890" y="812" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#64748b">两个头拼成 [3, 4]，再过 out_proj</text>

<rect x="500" y="840" width="520" height="110" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="520" y="866" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">拼头 → out_proj → O [3, 4]</text>
<text x="520" y="890" font-family="ui-monospace, monospace" font-size="10.5" fill="#1f2937">[1, 0, 0, 0]   [0.5, 0.5, 0, 0]</text>
<text x="520" y="910" font-family="ui-monospace, monospace" font-size="10.5" fill="#1f2937">[1/3, 1/3, 0.503, 0]</text>
<text x="520" y="934" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10" fill="#64748b">手算里 out_proj = I；真实模型会再混合两个头</text>

<text x="30" y="1000" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#1f2937">图例</text>
<rect x="30" y="1014" width="18" height="12" fill="#e0ecff" stroke="#3b6ea5"/><text x="54" y="1025" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#1f2937">Q</text>
<rect x="90" y="1014" width="18" height="12" fill="#fff7ed" stroke="#c2410c"/><text x="114" y="1025" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#1f2937">K</text>
<rect x="150" y="1014" width="18" height="12" fill="#ecfdf5" stroke="#047857"/><text x="174" y="1025" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#1f2937">V / 输出</text>
<rect x="250" y="1014" width="18" height="12" fill="#ede9fe" stroke="#6d28d9"/><text x="274" y="1025" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#1f2937">分数 / 权重</text>
<rect x="370" y="1014" width="18" height="12" fill="#e2e8f0" stroke="#94a3b8"/><text x="394" y="1025" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#1f2937">掩码 -∞</text>
<text x="30" y="1056" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#64748b">每个小格是一行；q/k 成对排在同一行，v 单独一行。T=3 时正好是 q0 k0 q1 k1 q2 k2。</text>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
