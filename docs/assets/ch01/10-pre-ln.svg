<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Pre-LN 与 Post-LN 的顺序</title>
<desc id="desc">Pre-LN 先 LayerNorm 再进子层，最后加残差；Post-LN 先子层和残差再 LayerNorm。</desc>
<rect width="1100" height="700" fill="#ffffff"/>
<text x="30" y="38" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">Pre-LN 与 Post-LN：归一化放在哪一步</text>
<text x="30" y="64" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">两条路径都从 x 到 x′；差别是 LayerNorm 在子层之前还是之后。</text>
<text x="150" y="120" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="600" fill="#047857">Pre-LN：先调匀</text>
<rect x="180" y="150" width="140" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="250.0" y="177.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">x</text>
<line x1="250" y1="194" x2="250" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="234" width="140" height="44" rx="8" fill="#ede9fe" stroke="#3b6ea5"/>
<text x="250.0" y="261.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6d28d9">LayerNorm</text>
<line x1="250" y1="278" x2="250" y2="314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="318" width="140" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="250.0" y="345.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">子层</text>
<line x1="250" y1="362" x2="250" y2="398" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="402" width="140" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="250.0" y="429.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">+ (x)</text>
<line x1="250" y1="446" x2="250" y2="482" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="486" width="140" height="44" rx="8" fill="#ecfdf5" stroke="#3b6ea5"/>
<text x="250.0" y="513.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#047857">x′</text>
<path d="M 320 172 L 360 172 L 360 424 L 322 424" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
<text x="368" y="300" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#047857">残差主路</text>
<text x="700" y="120" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="600" fill="#c2410c">Post-LN：后调匀</text>
<rect x="730" y="150" width="140" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="800.0" y="177.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">x</text>
<line x1="800" y1="194" x2="800" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="234" width="140" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="800.0" y="261.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">子层</text>
<line x1="800" y1="278" x2="800" y2="314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="318" width="140" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="800.0" y="345.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">+ (x)</text>
<line x1="800" y1="362" x2="800" y2="398" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="402" width="140" height="44" rx="8" fill="#ede9fe" stroke="#3b6ea5"/>
<text x="800.0" y="429.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6d28d9">LayerNorm</text>
<line x1="800" y1="446" x2="800" y2="482" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="486" width="140" height="44" rx="8" fill="#fff7ed" stroke="#3b6ea5"/>
<text x="800.0" y="513.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#c2410c">x′</text>
<path d="M 870 172 L 910 172 L 910 340 L 872 340" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="918" y="260" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#c2410c">残差主路经过 LN</text>
<text x="30" y="620" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">本书用 Pre-LN：归一化在子层之前，残差主路保持干净；残差本身在 1.7 讲。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs></svg>
