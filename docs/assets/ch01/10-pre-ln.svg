<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
<title id="title">Pre-LN：先 LayerNorm 再进子层</title>
<desc id="desc">x → LayerNorm → 子层 → +（x）→ x′</desc>
<rect width="560" height="700" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#1f2937">Pre-LN：先 LayerNorm 再进子层</text>
<text x="24" y="60" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">x → LayerNorm → 子层 → +（x）→ x′</text>
<rect x="180" y="100" width="160" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="260" y="127" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">x</text>
<line x1="260" y1="144" x2="260" y2="178" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="182" width="160" height="44" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
<text x="260" y="209" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6d28d9">LayerNorm</text>
<line x1="260" y1="226" x2="260" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="264" width="160" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="260" y="291" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">子层</text>
<line x1="260" y1="308" x2="260" y2="342" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="346" width="160" height="44" rx="8" fill="#f8fafc" stroke="#3b6ea5"/>
<text x="260" y="373" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">+（x）</text>
<line x1="260" y1="390" x2="260" y2="424" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="428" width="160" height="44" rx="8" fill="#ecfdf5" stroke="#047857"/>
<text x="260" y="455" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#047857">x′</text>
<path d="M 340 122 L 390 122 L 390 368 L 342 368" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
<text x="398" y="250" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#047857">残差主路</text>
<text x="24" y="520" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">归一化在子层之前，残差主路保持干净。</text>
<text x="24" y="548" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">x → LayerNorm → 子层 → +（x）→ x′</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs></svg>
