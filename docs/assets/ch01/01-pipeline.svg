<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" style="width:100%;height:auto" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">从文字到字符：第 1 节的管线</title>
<desc id="desc">the cat sat 的字符按 ord(ch) % 68 变成占位编号，11 个编号求和乘 31 取余得到答案 19，再查小写字母表得到 t。</desc>
<rect width="1120" height="660" fill="#ffffff"/>
<text x="30" y="36" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">从文字到字符：第 1 节的管线</text>
<text x="30" y="60" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">the cat sat（11 个字符）；中间省略 6 个。占位编号 = ord(ch) % 68；编号和答案都是占位。</text>
<text x="30" y="92" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b6ea5">输入文字</text>
<rect x="90" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="140.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">t</text>
<rect x="230" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="280.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">h</text>
<rect x="370" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="420.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">e</text>
<rect x="510" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="560.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">…</text>
<rect x="650" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="700.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">a</text>
<rect x="790" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="840.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">t</text>
<rect x="930" y="100" width="100" height="34" rx="6" fill="#f1f5f9"/><text x="980" y="121" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">11 个字符</text>
<line x1="140" y1="134" x2="140" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="280" y1="134" x2="280" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="420" y1="134" x2="420" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="134" x2="560" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="134" x2="700" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="840" y1="134" x2="840" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="90" y="174" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="140.0" y="198.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">48</text>
<rect x="230" y="174" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="280.0" y="198.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">36</text>
<rect x="370" y="174" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="420.0" y="198.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">33</text>
<rect x="510" y="174" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="560.0" y="198.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">…</text>
<rect x="650" y="174" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="700.0" y="198.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">29</text>
<rect x="790" y="174" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="840.0" y="198.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">48</text>
<rect x="930" y="174" width="100" height="40" rx="6" fill="#f1f5f9"/><text x="980" y="198" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">11 个编号</text>
<text x="30" y="198" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">占位编号</text>
<line x1="560" y1="214" x2="560" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="260" y="254" width="600" height="66" rx="8" fill="#f8fafc" stroke="#3b6ea5" stroke-dasharray="6 4"/><text x="560.0" y="280.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">sum(ids) = 48 + 36 + 33 + … + 29 + 48 = 413</text>
<text x="560" y="302" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">求和乘 31 再对 68 取余</text>
<line x1="560" y1="320" x2="560" y2="358" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="360" width="520" height="54" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="6 4"/><text x="560.0" y="391.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">answer = (413 × 31) mod 68 = 19</text>
<text x="30" y="390" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#c2410c">占位答案</text>
<line x1="560" y1="414" x2="560" y2="452" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="469" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">小写字母表</text>
<text x="30" y="487" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">a=0，b=1，…，t=19</text>
