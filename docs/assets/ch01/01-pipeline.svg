<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">从文字到字符：第 1 节的管线</title>
<desc id="desc">the cat sat 的字符变成占位编号，11 个编号求和乘 31 取余得到答案 19，再查小写字母表得到 t。</desc>
<rect width="1120" height="620" fill="#ffffff"/>
<text x="30" y="36" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">从文字到字符：第 1 节的管线</text>
<text x="30" y="60" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">the cat sat（11 个字符）；中间省略 6 个。编号和答案都是占位。</text>
<text x="30" y="94" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b6ea5">输入文字</text>
<rect x="60" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="110.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">t</text>
<line x1="110" y1="134" x2="110" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="170" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="110.0" y="194.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">48</text>
<rect x="220" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="270.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">h</text>
<line x1="270" y1="134" x2="270" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="170" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="270.0" y="194.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">36</text>
<rect x="380" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="430.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">e</text>
<line x1="430" y1="134" x2="430" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="170" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="430.0" y="194.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">33</text>
<rect x="540" y="100" width="100" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="590.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">…</text>
<line x1="590" y1="134" x2="590" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="540" y="170" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="590.0" y="194.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">…</text>
<rect x="700" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="750.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">a</text>
<line x1="750" y1="134" x2="750" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="700" y="170" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="750.0" y="194.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">29</text>
<rect x="860" y="100" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="910.0" y="121.33333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">t</text>
<line x1="910" y1="134" x2="910" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="860" y="170" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="910.0" y="194.33333333333334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">48</text>
<text x="30" y="160" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">占位编号 ord(ch) % 68</text>
<text x="590" y="238" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">11 个编号</text>
<line x1="560" y1="214" x2="560" y2="254" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="260" y="258" width="600" height="66" rx="8" fill="#f8fafc" stroke="#3b6ea5" stroke-dasharray="6 4"/><text x="560.0" y="295.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">sum(ids) = 48 + 36 + 33 + … + 29 + 48 = 413</text>
<text x="560" y="316" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">求和乘 31 再对 68 取余</text>
<line x1="560" y1="324" x2="560" y2="358" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="362" width="520" height="54" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="6 4"/><text x="560.0" y="393.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">answer = (413 × 31) mod 68 = 19</text>
<text x="30" y="348" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#c2410c">占位答案</text>
<line x1="560" y1="416" x2="560" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="60" y="468" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">小写字母表：a=0，b=1，…，t=19</text>
