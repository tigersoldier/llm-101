<text x="30" y="580" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">1.1 的编号和答案都是占位；1.2 换上 tokenizer，1.3 才展开数字，1.7 才有真正的分数。</text>
