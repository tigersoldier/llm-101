<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">从文字到字符：第 2 节的管线</title>
<desc id="desc">the cat sat 经 CharacterTokenizer 加上 BOS/EOS 得到 13 个编号，编号求和乘 31 取余得到占位答案 11，再 decode 成 l。</desc>
<rect width="1120" height="740" fill="#ffffff"/>
<text x="30" y="36" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">从文字到字符：第 2 节的管线</text>
<text x="30" y="60" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">the cat sat 加上 BOS/EOS，共 13 个编号；中间省略 7 个。编号是真的，答案仍是占位。</text>
<rect x="360" y="80" width="400" height="38" rx="8" fill="#eef2f7" stroke="#94a3b8"/><text x="560.0" y="103.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">输入文字 the cat sat</text>
<line x1="560" y1="118" x2="560" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="360" y="140" width="400" height="44" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="560.0" y="166.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">CharacterTokenizer：首尾加 &lt;bos&gt;/&lt;eos&gt;</text>
<line x1="560" y1="184" x2="560" y2="204" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="202" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">tokenizer 切出的 13 个 token</text>
<rect x="45" y="210" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="95.0" y="231.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2937">&lt;bos&gt;</text>
<line x1="95" y1="244" x2="95" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="280" width="100" height="40" rx="6" fill="#e0ecff" stroke="#94a3b8"/><text x="95.0" y="304.3333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">66</text>
<rect x="195" y="210" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="245.0" y="231.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2937">t</text>
<line x1="245" y1="244" x2="245" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="195" y="280" width="100" height="40" rx="6" fill="#e0ecff" stroke="#94a3b8"/><text x="245.0" y="304.3333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">19</text>
<rect x="345" y="210" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="395.0" y="231.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2937">h</text>
<line x1="395" y1="244" x2="395" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="345" y="280" width="100" height="40" rx="6" fill="#e0ecff" stroke="#94a3b8"/><text x="395.0" y="304.3333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">7</text>
<rect x="495" y="210" width="100" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="545.0" y="231.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2937">…</text>
<line x1="545" y1="244" x2="545" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="495" y="280" width="100" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="545.0" y="304.3333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">…</text>
<rect x="645" y="210" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="695.0" y="231.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2937">a</text>
<line x1="695" y1="244" x2="695" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="645" y="280" width="100" height="40" rx="6" fill="#e0ecff" stroke="#94a3b8"/><text x="695.0" y="304.3333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">0</text>
<rect x="795" y="210" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="845.0" y="231.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2937">t</text>
<line x1="845" y1="244" x2="845" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="795" y="280" width="100" height="40" rx="6" fill="#e0ecff" stroke="#94a3b8"/><text x="845.0" y="304.3333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">19</text>
<rect x="945" y="210" width="100" height="34" rx="6" fill="#eef2f7" stroke="#94a3b8"/><text x="995.0" y="231.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2937">&lt;eos&gt;</text>
<line x1="995" y1="244" x2="995" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="945" y="280" width="100" height="40" rx="6" fill="#e0ecff" stroke="#94a3b8"/><text x="995.0" y="304.3333333333333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1f2937">67</text>
<text x="30" y="272" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">编号（真实）</text>
<text x="600" y="352" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">13 个编号</text>
<line x1="560" y1="324" x2="560" y2="364" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="368" width="680" height="66" rx="8" fill="#f8fafc" stroke="#3b6ea5" stroke-dasharray="6 4"/><text x="560.0" y="405.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">sum(ids) = 66 + 19 + 7 + … + 0 + 19 + 67 = 325</text>
<text x="560" y="426" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">求和乘 31 再对 68 取余</text>
<line x1="560" y1="434" x2="560" y2="468" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="472" width="520" height="54" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="6 4"/><text x="560.0" y="503.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">answer = (325 × 31) mod 68 = 11</text>
<text x="30" y="458" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#c2410c">占位答案</text>
<line x1="560" y1="526" x2="560" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270" y="564" width="580" height="54" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="560.0" y="595.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">tokenizer.decode([11]) = &quot;l&quot;</text>
<text x="30" y="590" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#3b6ea5">解码（真实）</text>
<line x1="560" y1="618" x2="560" y2="650" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="450" y="654" width="220" height="54" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="560.0" y="685.6666666666666" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#1f2937">输出字符 l</text>
<text x="30" y="716" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">编号是真的；答案仍是占位；1.3 才展开数字，1.7 才有真正的分数。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
