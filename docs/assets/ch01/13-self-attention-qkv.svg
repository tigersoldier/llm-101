<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">自注意力：同一个输入，三种角色</title>
<desc id="desc">同一个 X 经三个不同投影得到 Q/K/V；Q 和 K 打分，softmax 后加权 V。</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="30" y="38" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">自注意力：同一个输入 X，三种不同的角色</text>
<text x="30" y="64" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">Q/K/V 不是三个原始向量，而是同一批 token 的三个可学习投影。</text>
<rect x="40" y="150" width="150" height="80" rx="8" fill="#eef2f7" stroke="#94a3b8"/><text x="115.0" y="194.66666666666666" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#1f2937">X [T, C]</text>
<rect x="280" y="120" width="230" height="60" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="395.0" y="154.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">Q = XW_Q + b_Q</text>
<rect x="560" y="120" width="150" height="60" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="635.0" y="153.66666666666666" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#1f2937">我想找什么</text>
<line x1="190" y1="150" x2="278" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="150" x2="558" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280" y="240" width="230" height="60" rx="8" fill="#fff7ed" stroke="#c2410c"/><text x="395.0" y="274.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">K = XW_K + b_K</text>
<rect x="560" y="240" width="150" height="60" rx="8" fill="#fff7ed" stroke="#c2410c"/><text x="635.0" y="273.6666666666667" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#1f2937">我有什么标签</text>
<line x1="190" y1="270" x2="278" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="270" x2="558" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280" y="360" width="230" height="60" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="395.0" y="394.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">V = XW_V + b_V</text>
<rect x="560" y="360" width="150" height="60" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="635.0" y="393.6666666666667" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#1f2937">我实际提供什么</text>
<line x1="190" y1="390" x2="278" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="390" x2="558" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="760" y="120" width="200" height="120" rx="8" fill="#f8fafc" stroke="#6d28d9"/><text x="860.0" y="184.0" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2937">scores = QKᵀ / √D softmax → 权重 O = 权重 × V</text>
<line x1="510" y1="300" x2="758" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="360" x2="758" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="760" y="300" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="860.0" y="334.3333333333333" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#064e3b">输出 O [T, C]</text>
<text x="30" y="520" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">W_Q/W_K/W_V 不同，所以同一个 token 在“查询”“标签”“内容”三个子空间里有不同的表示。</text>
<text x="30" y="548" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">Q/K 决定注意力权重，V 决定被加权的内容；输出仍是 [T, C]，再经过 out_proj。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs></svg>
