<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">自注意力：同一个输入，三种角色</title>
<desc id="desc">同一个 X 经三个不同投影得到 Q/K/V；Q 和 K 打分并 softmax 成权重；权重对 V 加权求和，得到输出 O。</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="30" y="38" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">自注意力：同一个输入 <tspan font-style="italic">X</tspan>，三种不同的角色</text>
<text x="30" y="64" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="12" fill="#64748b">Q/K/V 不是三个原始向量，而是同一批 token 的三个可学习投影。</text>

<rect x="40" y="250" width="180" height="80" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="130" y="286" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="14" fill="#1f2937">X [T, C]</text>
<text x="130" y="310" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="10.5" fill="#64748b">输入</text>

<rect x="300" y="110" width="300" height="80" rx="8" fill="#e0ecff" stroke="#3b6ea5"/>
<text x="450" y="143" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="12.5" fill="#1f2937"><tspan font-style="italic">Q</tspan> = <tspan font-style="italic">XW</tspan><tspan dy="3" font-size="8">Q</tspan><tspan dy="-3"> + </tspan><tspan font-style="italic">b</tspan><tspan dy="3" font-size="8">Q</tspan></text>
<text x="450" y="166" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="10.5" fill="#475569">我想找什么（query）</text>

<rect x="300" y="250" width="300" height="80" rx="8" fill="#fff7ed" stroke="#c2410c"/>
<text x="450" y="283" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="12.5" fill="#1f2937"><tspan font-style="italic">K</tspan> = <tspan font-style="italic">XW</tspan><tspan dy="3" font-size="8">K</tspan><tspan dy="-3"> + </tspan><tspan font-style="italic">b</tspan><tspan dy="3" font-size="8">K</tspan></text>
<text x="450" y="306" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="10.5" fill="#475569">我有什么标签（key）</text>

<rect x="300" y="390" width="300" height="80" rx="8" fill="#ecfdf5" stroke="#047857"/>
<text x="450" y="423" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="12.5" fill="#1f2937"><tspan font-style="italic">V</tspan> = <tspan font-style="italic">XW</tspan><tspan dy="3" font-size="8">V</tspan><tspan dy="-3"> + </tspan><tspan font-style="italic">b</tspan><tspan dy="3" font-size="8">V</tspan></text>
<text x="450" y="446" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="10.5" fill="#475569">我实际提供什么（value）</text>

<rect x="680" y="110" width="280" height="140" rx="8" fill="#f8fafc" stroke="#6d28d9"/>
<text x="820" y="146" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="12.5" fill="#1f2937"><tspan font-style="italic">S</tspan> = <tspan font-style="italic">QK</tspan><tspan dy="-4" font-size="8">T</tspan><tspan dy="4"> / √</tspan><tspan font-style="italic">D</tspan></text>
<text x="820" y="176" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="11.5" fill="#1f2937">softmax → 权重 <tspan font-style="italic">A</tspan></text>
<text x="820" y="202" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="10.5" fill="#475569">每一行归一化</text>

<rect x="680" y="330" width="280" height="120" rx="8" fill="#f8fafc" stroke="#6d28d9"/>
<text x="820" y="374" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="12.5" fill="#1f2937"><tspan font-style="italic">O</tspan> = <tspan font-style="italic">A</tspan> × <tspan font-style="italic">V</tspan></text>
<text x="820" y="400" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="11.5" fill="#1f2937">加权求和</text>
<text x="820" y="426" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="10.5" fill="#475569">拼头 → out_proj</text>

<rect x="680" y="498" width="280" height="60" rx="8" fill="#ecfdf5" stroke="#047857"/>
<text x="820" y="528" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="13" fill="#064e3b">输出 <tspan font-style="italic">O</tspan> [T, C]</text>
<text x="820" y="548" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="10.5" fill="#475569">下一层</text>

<line x1="220" y1="290" x2="298" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220" y1="290" x2="298" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220" y1="290" x2="298" y2="430" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="600" y1="150" x2="680" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="600" y1="290" x2="680" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="680" cy="180" r="3" fill="#64748b"/>

<line x1="820" y1="250" x2="820" y2="328" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="830" y="294" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="11" fill="#6d28d9" font-style="italic">A</text>

<line x1="600" y1="430" x2="678" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="820" y1="450" x2="820" y2="496" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="30" y="585" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="11" fill="#64748b"><tspan font-style="italic">W</tspan><tspan dy="3" font-size="8">Q</tspan><tspan dy="-3">/</tspan><tspan font-style="italic">W</tspan><tspan dy="3" font-size="8">K</tspan><tspan dy="-3">/</tspan><tspan font-style="italic">W</tspan><tspan dy="3" font-size="8">V</tspan><tspan dy="-3"> 不同，所以同一个 token 在“查询”“标签”“内容”三个子空间里有不同的表示。</tspan></text>
<text x="30" y="607" font-family="system-ui, 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="11" fill="#64748b"><tspan font-style="italic">Q</tspan>/<tspan font-style="italic">K</tspan> 决定注意力权重，<tspan font-style="italic">V</tspan> 决定被加权的内容；输出仍是 [T, C]，再经过 out_proj。</text>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
