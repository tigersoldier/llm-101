<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">原始用法：query/key/value 的软检索</title>
<desc id="desc">query 和三个 key 比较得到分数，softmax 成权重，再按权重读取 value。</desc>
<rect width="1000" height="600" fill="#ffffff"/>
<text x="30" y="38" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600" fill="#1f2937">原始用法：query 和 key 比较，按权重读取 value</text>
<text x="30" y="64" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">这是一个“软”检索：不是只取一个，而是按匹配程度把所有 value 混在一起。</text>
<rect x="40" y="130" width="190" height="100" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="135.0" y="184.33333333333334" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a5f">query 我渴了 → 想找：能喝的东西</text>
<text x="135" y="250" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">query 只负责“问”</text>
<rect x="300" y="110" width="150" height="50" rx="8" fill="#fff7ed" stroke="#c2410c"/><text x="375.0" y="139.33333333333334" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#7c2d12">key：水</text>
<rect x="520" y="110" width="150" height="50" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="595.0" y="139.33333333333334" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#064e3b">value：矿泉水</text>
<line x1="450" y1="135" x2="518" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="484" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c2410c">score 0.7</text>
<line x1="230" y1="135" x2="298" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="220" width="150" height="50" rx="8" fill="#fff7ed" stroke="#c2410c"/><text x="375.0" y="249.33333333333334" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#7c2d12">key：咖啡</text>
<rect x="520" y="220" width="150" height="50" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="595.0" y="249.33333333333334" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#064e3b">value：拿铁</text>
<line x1="450" y1="245" x2="518" y2="245" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="484" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c2410c">score 0.2</text>
<line x1="230" y1="245" x2="298" y2="245" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="330" width="150" height="50" rx="8" fill="#fff7ed" stroke="#c2410c"/><text x="375.0" y="359.3333333333333" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#7c2d12">key：茶</text>
<rect x="520" y="330" width="150" height="50" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="595.0" y="359.3333333333333" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#064e3b">value：龙井</text>
<line x1="450" y1="355" x2="518" y2="355" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="484" y="348" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c2410c">score 0.1</text>
<line x1="230" y1="355" x2="298" y2="355" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="375" y="250" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">key 负责“标签”</text>
<text x="595" y="250" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="10" fill="#64748b">value 负责“内容”</text>
<line x1="80" y1="250" x2="80" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="430" width="880" height="100" rx="8" fill="#e0ecff" stroke="#3b6ea5"/><text x="480.0" y="484.6666666666667" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#1e3a5f">0.7 × 矿泉水 + 0.2 × 拿铁 + 0.1 × 龙井 = 一杯偏水的结果</text>
<text x="30" y="570" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">query 和 key 决定“看谁”，value 决定“看到什么”；三者可以来自不同的表。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs></svg>
