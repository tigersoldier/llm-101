<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
  <title id="title">1.3 节的数据流</title>
  <desc id="desc">编号 [B,T] 经嵌入表变成 [B,T,C]，再经线性层变成 [B,T,out]。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="660" fill="#ffffff"/>
  <text x="30" y="36" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="600" fill="#1f2937">从编号到输出：两步形状变化</text>

  <rect x="110" y="60" width="500" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="135" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#1f2937">ids</text>
  <text x="195" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#475569">[B, T]</text>
  <text x="135" y="120" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">整数编号</text>

  <rect x="110" y="170" width="500" height="78" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="135" y="204" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#7c2d12">Embedding</text>
  <text x="135" y="230" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#9a3412">查表：按编号取行</text>

  <rect x="110" y="280" width="500" height="78" rx="10" fill="#e0ecff" stroke="#3b6ea5"/>
  <text x="135" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#1e3a5f">hidden</text>
  <text x="235" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#475569">[B, T, C]</text>
  <text x="135" y="340" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">每个位置 C 个数字</text>

  <rect x="110" y="390" width="500" height="78" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="135" y="424" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#7c2d12">Linear</text>
  <text x="225" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9a3412">x @ W + b</text>
  <text x="135" y="450" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#c2410c">再加偏置</text>

  <rect x="110" y="500" width="500" height="78" rx="10" fill="#ecfdf5" stroke="#047857"/>
  <text x="135" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#064e3b">out</text>
  <text x="200" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#065f46">[B, T, out]</text>
  <text x="135" y="560" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#047857">送进下一层</text>

  <line x1="360" y1="142" x2="360" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="252" x2="360" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="362" x2="360" y2="386" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="472" x2="360" y2="496" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="30" y="620" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">例：B=1，T=2，C=3；ids [[1, 3]] → hidden [1, 2, 3] → out [1, 2, 2]</text>
</svg>
