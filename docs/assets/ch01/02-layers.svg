<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">从编号到每个位置的数字</title>
  <desc id="desc">编号 [T] 经嵌入表变成 [T, C]：每个位置一行 C 个数字。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#ffffff"/>
  <text x="30" y="36" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="600" fill="#1f2937">从编号到每个位置的数字</text>

  <rect x="110" y="70" width="500" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="135" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#1f2937">ids</text>
  <text x="195" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#475569">[T]</text>
  <text x="135" y="130" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">整数编号</text>

  <rect x="110" y="180" width="500" height="78" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="135" y="214" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#7c2d12">Embedding</text>
  <text x="135" y="240" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#9a3412">查表：按编号取行</text>

  <rect x="110" y="290" width="500" height="78" rx="10" fill="#e0ecff" stroke="#3b6ea5"/>
  <text x="135" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#1e3a5f">hidden</text>
  <text x="235" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#475569">[T, C]</text>
  <text x="135" y="350" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b">每个位置 C 个数字</text>

  <line x1="360" y1="152" x2="360" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="262" x2="360" y2="286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="30" y="440" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">例：T=2，C=3；ids [1, 3] → hidden [2, 3]</text>
</svg>
