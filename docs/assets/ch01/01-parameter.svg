<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" role="img" aria-labelledby="title desc">
  <title id="title">Parameter 现在只存一个值</title>
  <desc id="desc">Parameter 包住一个 value 张量；第 3 章再加一块缓冲。</desc>
  <rect width="780" height="220" fill="#ffffff"/>
  <text x="30" y="36" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="600" fill="#1f2937">Parameter：一个命名的张量</text>
  <rect x="30" y="60" width="450" height="120" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="50" y="88" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#64748b">Parameter</text>
  <rect x="55" y="100" width="400" height="62" rx="8" fill="#e0ecff" stroke="#3b6ea5"/>
  <text x="75" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#1e3a5f">value</text>
  <text x="75" y="147" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#475569">形状 [2, 3]；模型真正读取的数字</text>
  <text x="510" y="100" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#334155">现在只有 value。</text>
  <text x="510" y="126" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#334155">第 3 章需要记录</text>
  <text x="510" y="152" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#334155">调整量时再加一块缓冲。</text>
</svg>
