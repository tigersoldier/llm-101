<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" style="width:100%;height:auto" viewBox="0 0 820 310" role="img" aria-labelledby="title desc">
<title id="title">字符、子词和整词三种切分单位</title>
<desc id="desc">同一个词 playing 在字符级是 7 个 token，在 BPE 子词级可以是 play 加 ing 两个 token，在词级是一个 token；三者的词表大小和序列长度取舍不同。</desc>
<rect width="820" height="310" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="600" fill="#1f2937">字符、子词和整词三种切分单位</text>
<text x="28" y="58" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">以 playing 为例；子词切法只是示意，实际切法由语料统计决定。</text>
<text x="28" y="104" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a5f">字符级</text>
<rect x="242.0" y="82" width="24" height="30" rx="5" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="254.0" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e3a5f">p</text>
<rect x="269.0" y="82" width="24" height="30" rx="5" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="281.0" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e3a5f">l</text>
<rect x="296.0" y="82" width="24" height="30" rx="5" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="308.0" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e3a5f">a</text>
<rect x="323.0" y="82" width="24" height="30" rx="5" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="335.0" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e3a5f">y</text>
<rect x="350.0" y="82" width="24" height="30" rx="5" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="362.0" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e3a5f">i</text>
<rect x="377.0" y="82" width="24" height="30" rx="5" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="389.0" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e3a5f">n</text>
<rect x="404.0" y="82" width="24" height="30" rx="5" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="416.0" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e3a5f">g</text>
<text x="520" y="104" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#475569">7 个 token · 词表小 · 序列长</text>
<text x="28" y="174" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#7c2d12">BPE（子词）</text>
<rect x="284.5" y="152" width="54" height="30" rx="5" fill="#fff7ed" stroke="#c2410c"/>
<text x="311.5" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#7c2d12">play</text>
<rect x="341.5" y="152" width="44" height="30" rx="5" fill="#fff7ed" stroke="#c2410c"/>
<text x="363.5" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#7c2d12">ing</text>
<text x="520" y="174" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#475569">2 个 token · 词表中等 · 折中</text>
<text x="28" y="244" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#14532d">词级</text>
<rect x="293.0" y="222" width="84" height="30" rx="5" fill="#ecfdf5" stroke="#2f7d5c"/>
<text x="335.0" y="242" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#14532d">playing</text>
<text x="520" y="244" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#475569">1 个 token · 词表巨大 · OOV 风险</text>
<text x="28" y="294" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">越往上，词表越小、序列越长；越往下，序列越短、词表越大。BPE 取中间。</text>
</svg>
