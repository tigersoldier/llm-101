<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" style="width:100%;height:auto" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">相邻对合并的训练循环</title>
<desc id="desc">文本列表先统计相邻对，选最高频的一对，在所有序列上合并，然后判断是否停止；停止时得到有序合并列表，否则回到统计。</desc>
<rect width="760" height="500" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="600" fill="#1f2937">相邻对合并的训练循环</text>
<text x="28" y="58" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">每一轮只选一对；停止后得到的就是编码时要按顺序重放的合并列表。</text>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs>
<rect x="275" y="76" width="210" height="42" rx="7" fill="#eef2f7" stroke="#94a3b8"/>
<text x="380" y="94" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1f2937">文本列表</text>
<text x="380" y="110" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">10 条短句，空格也是符号</text>
<line x1="380" y1="118" x2="380" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="180" y="142" width="400" height="48" rx="8" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="380" y="162" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">1. 统计所有序列的相邻对</text>
<text x="380" y="179" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">count_pairs(sequences)</text>
<line x1="380" y1="190" x2="380" y2="212" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="180" y="214" width="400" height="48" rx="8" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="380" y="234" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">2. 选频率最高的一对</text>
<text x="380" y="251" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#475569">并列时按 (left, right) 的字典序，保证可复现</text>
<line x1="380" y1="262" x2="380" y2="284" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="180" y="286" width="400" height="48" rx="8" fill="#eff6ff" stroke="#3b6ea5"/>
<text x="380" y="306" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">3. 在所有序列上合并这一对</text>
<text x="380" y="323" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">merge_pair(sequence, best_pair)</text>
<line x1="380" y1="334" x2="380" y2="356" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="150" y="358" width="460" height="58" rx="8" fill="#fff7ed" stroke="#c2410c"/>
<text x="380" y="379" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#7c2d12">4. 停止？</text>
<text x="380" y="397" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#7c2d12">达到次数上限 / 最高频率 &lt; 阈值 / 没有相邻对</text>
<path d="M150 416 H80 V163 H180" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="86" y="280" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#475569">继续</text>
<line x1="380" y1="416" x2="380" y2="438" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="392" y="431" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#475569">停止</text>
<rect x="255" y="440" width="250" height="38" rx="8" fill="#ecfdf5" stroke="#2f7d5c"/>
<text x="380" y="464" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#14532d">有序合并列表</text>
</svg>
