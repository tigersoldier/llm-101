<text x="28" y="34" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="600" fill="#1f2937">lower 与 lowest 的合并阶梯</text>
<text x="28" y="58" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">同一份合并列表按 rank 依次作用；rank 3 只作用于 lower，rank 4–5 只作用于 lowest。浅蓝是共享前缀，橙色、绿色、紫色是各自完成的词。</text>
