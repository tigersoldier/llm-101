<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" style="width:100%;height:auto" viewBox="0 0 840 470" role="img" aria-labelledby="title desc">
<title id="title">lower 与 lowest 的合并阶梯</title>
<desc id="desc">同一份合并列表按 rank 依次作用：rank 0 合并 l+o，rank 1 合并 lo+w，rank 2 合并 low+e；rank 3 只合并 lowe+r，rank 4 合并 lowe+s，rank 5 合并 lowes+t。</desc>
