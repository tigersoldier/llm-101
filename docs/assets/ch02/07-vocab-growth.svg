<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" style="width:100%;height:auto" viewBox="0 0 820 340" role="img" aria-labelledby="title desc">
<title id="title">词表随合并次数增长</title>
<desc id="desc">初始词表是 3 个特殊 token 加 143 个码点，共 146 个；每完成一次产生新 token 的合并增加 1，366 次合并后到达 512。</desc>
<rect width="820" height="340" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="600" fill="#1f2937">词表随合并次数增长</text>
<text x="28" y="58" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">初始 3 + 143 = 146；每次合并追加一个新 token，366 次后到达 512。</text>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs>
<line x1="110" y1="280" x2="760" y2="280" stroke="#64748b" stroke-width="1.5"/>
<line x1="110" y1="280" x2="110" y2="80" stroke="#64748b" stroke-width="1.5"/>
<line x1="110.0" y1="280" x2="110.0" y2="285" stroke="#64748b"/>
<text x="110.0" y="302" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">0</text>
<line x1="287.6" y1="280" x2="287.6" y2="285" stroke="#64748b"/>
<text x="287.6" y="302" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">100</text>
<line x1="465.2" y1="280" x2="465.2" y2="285" stroke="#64748b"/>
<text x="465.2" y="302" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">200</text>
<line x1="642.8" y1="280" x2="642.8" y2="285" stroke="#64748b"/>
<text x="642.8" y="302" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">300</text>
<line x1="760.0" y1="280" x2="760.0" y2="285" stroke="#64748b"/>
<text x="760.0" y="302" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">366</text>
<line x1="105" y1="280.0" x2="110" y2="280.0" stroke="#64748b"/>
<text x="100" y="284.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#475569">146</text>
<line x1="110" y1="280.0" x2="760" y2="280.0" stroke="#e2e8f0" stroke-width="1"/>
<line x1="105" y1="219.9" x2="110" y2="219.9" stroke="#64748b"/>
<text x="100" y="223.9" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#475569">256</text>
<line x1="110" y1="219.9" x2="760" y2="219.9" stroke="#e2e8f0" stroke-width="1"/>
<line x1="105" y1="149.9" x2="110" y2="149.9" stroke="#64748b"/>
<text x="100" y="153.9" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#475569">384</text>
<line x1="110" y1="149.9" x2="760" y2="149.9" stroke="#e2e8f0" stroke-width="1"/>
<line x1="105" y1="80.0" x2="110" y2="80.0" stroke="#64748b"/>
<text x="100" y="84.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#475569">512</text>
<line x1="110" y1="80.0" x2="760" y2="80.0" stroke="#e2e8f0" stroke-width="1"/>
<line x1="110.0" y1="280.0" x2="760.0" y2="80.0" stroke="#2f7d5c" stroke-width="2.4"/>
<line x1="110" y1="80.0" x2="760" y2="80.0" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="760.0" cy="80.0" r="4" fill="#2f7d5c"/>
<text x="750" y="72.0" text-anchor="end" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#c2410c">目标 512</text>
<text x="752.0" y="98.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#2f7d5c">366 次 → 512</text>
<text x="435.0" y="322" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#475569">合并次数（merge rank 递增）</text>
<text x="18" y="180.0" transform="rotate(-90 18 180.0)" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#475569">词表大小</text>
</svg>
